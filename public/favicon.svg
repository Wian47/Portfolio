<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wian Schoeman">
  <!--
    The W is a stroked path rather than type, so it renders identically without
    loading a font, and stays legible down to 16px. Ember on charcoal, the same
    accent the site uses.
  -->
  <rect width="64" height="64" rx="14" fill="#141210"/>
  <path d="M11 17 L23 47 L32 28 L41 47 L53 17" fill="none" stroke="#c9704a"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
