<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wian Schoeman — IT Support, Systems & Security</title>
    <meta name="description" content="IT support, systems administration and security. Helpdesk and end-user support, server deployment, networking and infrastructure." />
    <meta name="theme-color" content="#141210" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 6rem;
        background-color: #141210;
      }

      body {
        /* Stop iOS inflating body copy in landscape, and kill the blue tap flash */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
        font-weight: 300;
        background-color: #141210;
        color: #ece5d8;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: #c9704a;
        color: #141210;
      }

      /* Thin, unobtrusive scrollbar rather than hiding it entirely */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #141210; }
      ::-webkit-scrollbar-thumb { background: #2b2622; border: 3px solid #141210; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a342e; }
      html { scrollbar-width: thin; scrollbar-color: #2b2622 #141210; }

      /* Instrument Serif is drawn small on the body-height metric; nudge optical size */
      .font-display { font-weight: 400; }

      /*
        Scroll reveals. Driven by IntersectionObserver adding [data-shown] rather
        than a JS animation loop, so the browser only does one transition per
        element - this stays smooth even when compositing on the CPU.
      */
      [data-reveal] {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        transition-delay: var(--reveal-delay, 0ms);
      }
      [data-reveal][data-shown] {
        opacity: 1;
        transform: none;
      }

      /* Masked line-by-line rise for the hero wordmark */
      .rise-mask { overflow: hidden; display: block; }
      .rise-line {
        display: block;
        transform: translateY(110%);
        animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: var(--rise-delay, 0ms);
      }
      @keyframes rise { to { transform: translateY(0); } }

      .fade-in {
        opacity: 0;
        animation: fadeIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: var(--fade-delay, 0ms);
      }
      @keyframes fadeIn { to { opacity: 1; } }

      /* Hairline that draws itself across when revealed */
      .rule-draw {
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      [data-shown] .rule-draw, .rule-draw[data-shown] { transform: scaleX(1); }

      /*
        Lite tier: set by utils/perf.ts when the browser is compositing on the CPU
        (GPU acceleration off) or the user asked for reduced motion. Blend modes,
        blurs and looping animations are re-rasterised every frame in software, so
        they are stripped globally. One-shot transitions are cheap and stay.
      */
      html[data-perf="lite"] { scroll-behavior: auto; }
      html[data-perf="lite"] * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        mix-blend-mode: normal !important;
        will-change: auto !important;
      }
      html[data-perf="lite"] [class*="blur-"]:not([class*="backdrop-blur"]) {
        filter: none !important;
      }
      html[data-perf="lite"] .grain { display: none !important; }
      html[data-perf="lite"] .rise-line { animation-duration: 0.5s; }

      /* A genuine reduced-motion request means no movement at all, only fades */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        [data-reveal] { transform: none; transition: opacity 0.4s linear; }
        .rise-line { animation: none; transform: none; }
        .rule-draw { transition: none; transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
