<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wian Schoeman - Cyber Security Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px; /* Offset for fixed header */
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #31326f; /* Deep Indigo base */
        color: #fff;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Syncopate', sans-serif;
      }

      /*
        Lite tier: set by utils/perf.ts when the browser is compositing on the CPU
        (GPU acceleration off) or the user asked for reduced motion. Blurs, blend
        modes and backdrop filters are re-rasterised every frame in software, so
        they are stripped globally rather than component by component.
      */
      html[data-perf="lite"] {
        scroll-behavior: auto;
      }
      html[data-perf="lite"] * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        mix-blend-mode: normal !important;
        will-change: auto !important;
      }
      html[data-perf="lite"] [class*="blur-"]:not([class*="backdrop-blur"]) {
        filter: none !important;
      }
      html[data-perf="lite"] *,
      html[data-perf="lite"] *::before,
      html[data-perf="lite"] *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      /* backdrop-blur panels lose their frost, so give them a solid enough base */
      html[data-perf="lite"] .backdrop-blur-sm,
      html[data-perf="lite"] .backdrop-blur-md,
      html[data-perf="lite"] .backdrop-blur-lg,
      html[data-perf="lite"] .backdrop-blur-xl {
        background-color: rgba(26, 27, 59, 0.92);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
